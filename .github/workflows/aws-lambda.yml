name: Deploy to AWS Lambda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lambda/discord-notifier/**'
      - '.github/workflows/aws-lambda.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write   # This is required for OIDC authentication
  contents: read    # This is required to checkout the repository

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: lambda/discord-notifier/requirements.txt

    - name: Build Lambda package
      run: |
        mkdir -p build/lambda
        python -m pip install \
          --requirement lambda/discord-notifier/requirements.txt \
          --target build/lambda
        cp lambda/discord-notifier/lambda_function.py build/lambda/

    - name: Deploy Lambda function
      uses: aws-actions/aws-lambda-deploy@v1.1.2
      with:
        function-name: discord-notifier
        code-artifacts-dir: build/lambda
        handler: lambda_function.lambda_handler
        runtime: python3.14
