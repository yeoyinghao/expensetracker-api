# Builds an image, pushes it to ECR, copies the task definition currently used
# by the ECS service, changes only the image, and deploys the new revision.

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/aws-ecs.yml'
      - '*.gradle'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: expense-tracker-api-repo
  ECS_SERVICE: etracker-api
  ECS_CLUSTER: etracker-cluster
  CONTAINER_NAME: etracker-api
  IMAGE_TAG_PREFIX: dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
        role-session-name: ConfigAWSCredsSession

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ env.IMAGE_TAG_PREFIX }}-${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        docker build --quiet -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . > /dev/null
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # Start from the revision actually deployed by the service, rather than the
    # latest family revision. This preserves all ECS environment variables and
    # Secrets Manager/SSM references, including changes made outside this repo.
    - name: Download current Amazon ECS task definition
      run: |
        TASK_DEFINITION_ARN="$(aws ecs describe-services \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE" \
          --query 'services[0].taskDefinition' \
          --output text)"

        test "$TASK_DEFINITION_ARN" != "None"

        aws ecs describe-task-definition \
          --task-definition "$TASK_DEFINITION_ARN" \
          --query taskDefinition \
          --output json |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: false

    - name: Start ECS service after bootstrap
      run: |
        DESIRED_COUNT="$(aws ecs describe-services \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE" \
          --query 'services[0].desiredCount' \
          --output text)"

        if [ "$DESIRED_COUNT" = "0" ]; then
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 1 \
            --no-cli-pager
        fi

    - name: Wait for ECS service stability
      run: |
        aws ecs wait services-stable \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE"